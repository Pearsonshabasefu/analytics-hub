[project]
name = "refineiq-backend"
version = "0.1.0"
description = "RefineIQ - FastAPI Backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "supabase>=2.10.0",
    "python-jose[cryptography]>=3.3.0",
    "polars>=1.43.2",
    "presidio-analyzer>=2.2.356",
    "presidio-anonymizer>=2.2.356",
    "google-generativeai>=0.8.0",
    "modal>=0.73.0",
    "resend>=2.5.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "shap>=0.46.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "numpy>=1.26.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
