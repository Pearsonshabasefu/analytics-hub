# ============================================================================
# RefineIQ Production Cache Access Control List (ACL) & Network Binding
# Redis 6+ / Valkey Security Configuration
# ============================================================================

# 1. Bind strictly to local loopback and the authorized deployment private network
# Replace ${DEPLOYMENT_IP_RANGE} with your cloud internal subnet (e.g. 10.0.0.0/16)
bind 127.0.0.1 ${DEPLOYMENT_IP_RANGE}
protected-mode yes
port 6379

# 2. Disable the default unauthenticated user
user default off

# 3. Create least-privilege application user
# Restricts access strictly to keys prefixed with 'refineiq:'
# Permits ONLY the commands the application uses (+get +set +del +expire +mget +mset +incr +decr)
# Explicitly blocks all administrative and dangerous commands (-@dangerous -@admin -@pubsub -FLUSHALL -CONFIG -DEBUG)
user refineiq_app on >${REDIS_APP_PASSWORD} ~refineiq:* +get +set +del +expire +mget +mset +incr +decr -@dangerous -@admin -@pubsub

# 4. Mandatory TLS in transit
tls-port 6380
tls-cert-file /etc/ssl/redis/redis.crt
tls-key-file /etc/ssl/redis/redis.key
tls-ca-cert-file /etc/ssl/redis/ca.crt
tls-auth-clients yes
